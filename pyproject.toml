[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posthog-impact-phase1"
version = "1.0.0"
description = "Phase 1 data-ingestion foundation for a PostHog engineering-impact dashboard"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.1.3",
    "pyarrow==18.1.0",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "requests==2.32.3",
    "PyYAML==6.0.2",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
impact = "impact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: opt-in tests that hit the network or the full clone (deselected by default)",
]
addopts = "-q -m 'not integration'"
