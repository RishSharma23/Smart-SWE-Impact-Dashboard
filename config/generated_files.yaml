# Path-shape classification.
#
# These labels are DESCRIPTORS, never filters.  A lockfile-only PR stays in the
# dataset with lockfile_only=true so a consumer can decide what it means.
# Order does not matter: a path can carry several labels at once (a generated
# test snapshot is both `generated` and `test`).

# Every rule is a glob evaluated against the repository-relative POSIX path.
categories:

  lockfile:
    globs:
      - '**/pnpm-lock.yaml'
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/uv.lock'
      - '**/poetry.lock'
      - '**/Cargo.lock'
      - '**/Pipfile.lock'
      - '**/composer.lock'
      - '**/go.sum'
      - '**/requirements*.txt'

  snapshot:
    globs:
      - '**/__snapshots__/**'
      - '**/*.ambr'
      - '**/*.snap'
      - '**/__image_snapshots__/**'
      - '**/*-snapshots/**'

  generated:
    globs:
      - '**/*.generated.*'
      - '**/generated/**'
      - '**/gen/**'
      - '**/*_pb2.py'
      - '**/*_pb2.pyi'
      - '**/*_pb.js'
      - '**/*.pb.go'
      - '**/*.d.ts'
      - 'frontend/src/types.ts'
      - 'frontend/src/queries/schema.json'
      - 'posthog/schema.py'
      - '**/schema.json'
      - '**/*.kea-typegen.ts'
      - '**/kea-typegen/**'
      - '**/*Type.ts'
      - '**/*.min.js'
      - '**/*.map'
    # Additional content-based signal applied when the blob is available.
    content_markers:
      - '@generated'
      - 'DO NOT EDIT'
      - 'Code generated by'
      - 'autogenerated'

  vendor:
    globs:
      - '**/vendor/**'
      - '**/vendored/**'
      - '**/node_modules/**'
      - '**/third_party/**'
      - 'patches/**'

  migration:
    globs:
      - '**/migrations/**'
      - '**/migration/**'
      - 'posthog/clickhouse/migrations/**'
      - '**/alembic/versions/**'
      - '**/*.sql'

  test:
    globs:
      - '**/test/**'
      - '**/tests/**'
      - '**/__tests__/**'
      - '**/*_test.py'
      - '**/test_*.py'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.test.js'
      - '**/*.test.jsx'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
      - '**/*.spec.js'
      - '**/conftest.py'
      - 'playwright/**'
      - '**/e2e/**'
      - '**/cypress/**'
      - '**/*.stories.tsx'

  docs:
    globs:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.rst'
      - 'docs/**'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '**/README*'

  config:
    globs:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.toml'
      - '**/*.ini'
      - '**/*.cfg'
      - '**/.env*'
      - '**/tsconfig*.json'
      - '**/package.json'
      - '**/pyproject.toml'
      - '**/Dockerfile*'
      - '**/docker-compose*.yml'
      - '.github/**'
      - '**/*.editorconfig'

  ci:
    globs:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.circleci/**'
      - '**/Jenkinsfile'

  infrastructure:
    globs:
      - 'terraform/**'
      - 'docker/**'
      - 'charts/**'
      - '**/*.tf'
      - 'bin/**'
      - 'devenv/**'

  styling:
    globs:
      - '**/*.css'
      - '**/*.scss'
      - '**/*.less'
      - '**/*.sass'
      - '**/*.styl'

  localization:
    globs:
      - '**/locales/**'
      - '**/i18n/**'
      - '**/*.po'
      - '**/*.pot'

  binary_asset:
    globs:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.ico'
      - '**/*.woff*'
      - '**/*.ttf'
      - '**/*.mp4'
      - '**/*.webm'
      - '**/*.pdf'
      - '**/*.zip'
      - '**/*.parquet'

# Risk-surface flags.  Presence of ANY matching path raises the flag on the PR.
# These are evidence markers for blast radius, not severity scores.
risk_surfaces:
  public_api:
    globs:
      - 'posthog/api/**'
      - 'products/*/backend/api/**'
      - '**/openapi*.yaml'
      - '**/*.proto'
      - 'proto/**'
  schema:
    globs:
      - 'posthog/schema.py'
      - 'frontend/src/queries/schema/**'
      - 'frontend/src/queries/schema.json'
      - '**/models.py'
      - 'posthog/models/**'
      - 'posthog/hogql/database/schema/**'
  migration:
    globs:
      - '**/migrations/**'
      - 'posthog/clickhouse/migrations/**'
  auth_privacy:
    globs:
      - '**/auth/**'
      - '**/permissions*.py'
      - '**/rbac/**'
      - 'products/access_control/**'
      - '**/scopes*.py'
      - '**/*oauth*'
      - '**/*saml*'
      - '**/session/**'
  billing:
    globs:
      - '**/billing/**'
      - 'ee/billing/**'
      - '**/*stripe*'
      - '**/quota*'
  ingestion:
    globs:
      - 'nodejs/**'
      - 'products/ingestion/**'
      - 'rust/capture/**'
      - 'plugin-server/**'
  data_pipeline:
    globs:
      - 'posthog/temporal/**'
      - 'posthog/dags/**'
      - 'products/batch_exports/**'
      - 'products/data_warehouse/**'
      - 'dags/**'
  deployment:
    globs:
      - '.github/workflows/**'
      - 'docker/**'
      - 'terraform/**'
      - '**/Dockerfile*'
      - 'charts/**'
  shared_library:
    globs:
      - 'common/**'
      - 'packages/**'
      - 'frontend/src/lib/**'
      - 'posthog/utils.py'
      - 'rust/common/**'
  feature_flag_surface:
    globs:
      - 'products/feature_flags/**'
      - 'posthog/models/feature_flag/**'
      - 'rust/feature-flags/**'

# Language inference by extension.  `unknown` is a real value, not a default of
# convenience -- it is reported in the coverage table.
languages:
  '.py': python
  '.pyi': python
  '.ts': typescript
  '.tsx': typescript
  '.js': javascript
  '.jsx': javascript
  '.mjs': javascript
  '.cjs': javascript
  '.rs': rust
  '.go': go
  '.sql': sql
  '.hog': hog
  '.css': css
  '.scss': scss
  '.md': markdown
  '.mdx': markdown
  '.json': json
  '.yaml': yaml
  '.yml': yaml
  '.toml': toml
  '.sh': shell
  '.bash': shell
  '.rb': ruby
  '.java': java
  '.kt': kotlin
  '.swift': swift
  '.m': objc
  '.proto': protobuf
  '.tf': terraform
  '.html': html
  '.xml': xml
  '.ambr': snapshot
  '.snap': snapshot

# A change is "mechanical/bulk" when it is overwhelmingly one of the labels
# above.  Recorded as an anomaly descriptor, never used to discard a PR.
bulk_change:
  min_files: 25
  min_share_single_category: 0.9
  categories_considered:
    - lockfile
    - snapshot
    - generated
    - vendor
    - binary_asset
    - localization
